<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Productos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            th:href="@{/}"
        >
            Spring Store
        </a>

    </div>

</nav>


<div class="container py-5">

    <div
        class="d-flex
               justify-content-between
               align-items-center
               mb-4"
    >

        <h1>Productos</h1>

        <a
            class="btn btn-primary"
            th:href="@{/productos/nuevo}"
        >
            Nuevo producto
        </a>

    </div>


    <table class="table table-striped table-hover">

        <thead>

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="producto : ${productos}">

            <td th:text="${producto.id}"></td>

            <td th:text="${producto.nombre}"></td>

            <td th:text="${'S/ ' + producto.precio}"></td>

            <td th:text="${producto.stock}"></td>

            <td>

                <a
                    class="btn btn-info btn-sm"
                    th:href="@{/productos/{id}(id=${producto.id})}"
                >
                    Ver
                </a>

                <a
                    class="btn btn-warning btn-sm"
                    th:href="@{/productos/{id}/editar(id=${producto.id})}"
                >
                    Editar
                </a>

                <form
                    th:action="@{/productos/{id}/eliminar(id=${producto.id})}"
                    method="post"
                    style="display:inline"
                >

                    <button
                        type="submit"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Desea eliminar el producto?')"
                    >
                        Eliminar
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <div
        th:if="${#lists.isEmpty(productos)}"
        class="alert alert-info"
    >
        No existen productos registrados.
    </div>

</div>

</body>

</html>
