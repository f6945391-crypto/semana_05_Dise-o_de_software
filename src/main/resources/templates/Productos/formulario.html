<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Producto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div class="container py-5">

    <h1
        th:text="${producto.id == null}
        ? 'Nuevo producto'
        : 'Editar producto'"
    ></h1>


    <form
        th:object="${producto}"
        th:action="${producto.id == null}
            ? @{/productos}
            : @{/productos/{id}(id=${producto.id})}"
        method="post"
    >

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{nombre}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Descripción
            </label>

            <textarea
                class="form-control"
                th:field="*{descripcion}"
                rows="3"
            ></textarea>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Precio
            </label>

            <input
                type="number"
                step="0.01"
                min="0.01"
                class="form-control"
                th:field="*{precio}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Stock
            </label>

            <input
                type="number"
                min="0"
                class="form-control"
                th:field="*{stock}"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-success"
        >
            Guardar
        </button>

        <a
            class="btn btn-secondary"
            th:href="@{/productos}"
        >
            Cancelar
        </a>

    </form>

</div>

</body>

</html>
