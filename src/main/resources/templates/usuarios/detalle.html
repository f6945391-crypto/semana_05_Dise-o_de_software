<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Detalle del usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div class="container py-5">

    <div class="card shadow mb-4">

        <div class="card-body">

            <h1 th:text="${usuario.nombre}"></h1>

            <hr>

            <p>
                <strong>Código:</strong>
                <span th:text="${usuario.id}"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span th:text="${usuario.email}"></span>
            </p>

            <p>
                <strong>Teléfono:</strong>
                <span th:text="${usuario.telefono}"></span>
            </p>

            <a
                class="btn btn-secondary"
                th:href="@{/usuarios}"
            >
                Regresar
            </a>

            <a
                class="btn btn-warning"
                th:href="@{/usuarios/{id}/editar(id=${usuario.id})}"
            >
                Editar
            </a>

        </div>

    </div>


    <!-- ==== Relacion muchos-a-muchos: productos del usuario (carrito) ==== -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h3>Productos del carrito</h3>

            <table class="table table-striped">

                <thead>

                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="detalle : ${usuario.detalles}">

                    <td th:text="${detalle.producto.nombre}"></td>

                    <td th:text="${'S/ ' + detalle.producto.precio}"></td>

                    <td th:text="${detalle.cantidad}"></td>

                    <td th:text="${detalle.fechaPedido}"></td>

                    <td>

                        <form
                            th:action="@{/usuarios/{id}/productos/{productoId}/eliminar
                                (id=${usuario.id}, productoId=${detalle.producto.id})}"
                            method="post"
                            style="display:inline"
                        >

                            <button
                                type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('¿Quitar el producto del carrito?')"
                            >
                                Quitar
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>


            <div
                th:if="${#lists.isEmpty(usuario.detalles)}"
                class="alert alert-info"
            >
                Este usuario no tiene productos en el carrito.
            </div>

        </div>

    </div>


    <!-- ==== Formulario para agregar un producto al carrito ==== -->

    <div class="card shadow">

        <div class="card-body">

            <h3>Agregar producto</h3>

            <form
                th:action="@{/usuarios/{id}/productos(id=${usuario.id})}"
                method="post"
                class="row g-3 align-items-end"
            >

                <div class="col-md-6">

                    <label class="form-label">
                        Producto
                    </label>

                    <select
                        name="productoId"
                        class="form-select"
                        required
                    >

                        <option
                            th:each="producto : ${productos}"
                            th:value="${producto.id}"
                            th:text="${producto.nombre + ' (S/ ' + producto.precio + ')'}"
                        ></option>

                    </select>

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Cantidad
                    </label>

                    <input
                        type="number"
                        name="cantidad"
                        class="form-control"
                        min="1"
                        value="1"
                        required
                    >

                </div>


                <div class="col-md-3">

                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Agregar
                    </button>

                </div>

            </form>


            <div
                th:if="${#lists.isEmpty(productos)}"
                class="alert alert-warning mt-3"
            >
                No hay productos registrados. Cree productos antes de agregarlos.
            </div>

        </div>

    </div>

</div>

</body>

</html>
