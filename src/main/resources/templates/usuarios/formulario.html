<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div class="container py-5">

    <h1
        th:text="${usuario.id == null}
        ? 'Nuevo usuario'
        : 'Editar usuario'"
    ></h1>


    <form
        th:object="${usuario}"
        th:action="${usuario.id == null}
            ? @{/usuarios}
            : @{/usuarios/{id}(id=${usuario.id})}"
        method="post"
    >

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{nombre}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                class="form-control"
                th:field="*{email}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Teléfono
            </label>

            <input
                type="tel"
                class="form-control"
                th:field="*{telefono}"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-success"
        >
            Guardar
        </button>

        <a
            class="btn btn-secondary"
            th:href="@{/usuarios}"
        >
            Cancelar
        </a>

    </form>

</div>

</body>

</html>
